name: Web Installer Testing
description: Automated testing of the Moodle web installation
inputs:
  repository:
    description: 'Repository to clone'
    required: true
  branch:
    description: 'Branch to clone'
    required: true
  php:
    description: 'PHP Version to test'
    required: true
    default: 8.3

#
# It's triggered manually (workflow_dispatch) and helps to ensure that the web installation process works as
# expected and helps to detect any issues early.
#
# The workflow sets up a PostgreSQL database and PHP, clones the Moodle branch under test and runs the install
# Behat test from this action's own directory.
# On failure it collects everything needed to diagnose the problem (the response the browser received, the web
# server log, a screenshot of the page the test stopped on and the Moodle revision under test) into a single
# artifact, and summarises the failure on the run page.
#
# For more information about the web install testing, see https://github.com/moodlehq/moodle-webinstaller-test

runs:
  using: "composite"
  steps:
    - name: Print repository and branch
      shell: bash
      run: |
        echo "Repository: ${{ inputs.repository }}"
        echo "Branch: ${{ inputs.branch }}"
        echo "Test suite: ${{ github.action_path }}"

    - name: Setting up PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ inputs.php }}
        ini-values: max_input_vars=5000
        coverage: none

    - name: Clone specified repository and branch
      run: |
        # Enough history to report what recently landed when the install breaks.
        git clone --depth 50 -b ${{ inputs.branch }} ${{ inputs.repository }} moodle
      shell: bash

    # The test suite is this action's own code, so it is used from the action directory rather than
    # cloned. Cloning always fetched the default branch, so a change to the suite could never be
    # tested by its own pull request.
    - name: Install Plugin Composer Dependencies
      shell: bash
      run: composer install
      working-directory: ${{ github.action_path }}

    - name: Record the Moodle revision under test
      shell: bash
      working-directory: moodle
      run: |
        mkdir -p "${ARTIFACT_DIR}"
        versionfile=version.php
        if [ -f public/version.php ]; then
          versionfile=public/version.php
        fi
        {
          echo "Repository: ${{ inputs.repository }}"
          echo "Branch: ${{ inputs.branch }}"
          echo "HEAD: $(git rev-parse HEAD)"
          echo
          grep -E '^\$(version|release|branch)' "${versionfile}" || true
          echo
          echo "Last 20 commits:"
          git log --oneline -20
        } | tee "${ARTIFACT_DIR}/moodle-revision.txt"
      env:
        ARTIFACT_DIR: ${{ github.workspace }}/artifacts

    - name: Start PHP built-in server
      shell: bash
      run: |
        nohup php -S localhost:8080 -t ./public > server.log 2>&1 &
        echo "Waiting for PHP built-in server to be ready..."
        for i in {1..5}; do
          if nc -z localhost 8080; then
            echo "PHP built-in server is ready"
            break
          else
            echo "Waiting for PHP built-in server to be ready..."
            sleep 2
          fi
        done
      working-directory: moodle

    - name: Install Puppeteer
      shell: bash
      run: npm install puppeteer
      working-directory: ${{ github.action_path }}

    - name: Take screenshot of Moodle installation page
      shell: bash
      run: node screenshot.js ${{ inputs.php }}
      working-directory: ${{ github.action_path }}
      env:
        ARTIFACT_DIR: ${{ github.workspace }}/artifacts
        MOODLE_SITE_URL: http://localhost:8080/moodle

    - name: Run Behat tests
      shell: bash
      run: |
        mkdir -p "${ARTIFACT_DIR}"
        set +e
        vendor/bin/behat tests/behat/install.feature -vvv --strict 2>&1 \
          | tee "${ARTIFACT_DIR}/behat-output.txt"
        exitcode=${PIPESTATUS[0]}
        set -e
        # Recorded outside the artifacts directory: the later steps need to know whether Behat
        # failed (composite action steps cannot use continue-on-error), but this is not diagnostic
        # material worth uploading.
        echo "${exitcode}" > "${RUNNER_TEMP}/behat-exit-code"
        exit "${exitcode}"
      working-directory: ${{ github.action_path }}
      env:
        ARTIFACT_DIR: ${{ github.workspace }}/artifacts
        MOODLE_SITE_URL: http://localhost:8080/moodle
        DB_TYPE: pgsql
        DB_HOST: localhost
        DB_NAME: test
        DB_USER: test
        DB_PASS: test

    - name: Take screenshot of the failing page
      shell: bash
      if: ${{ !cancelled() }}
      run: |
        if [ "$(cat "${RUNNER_TEMP}/behat-exit-code" 2>/dev/null)" = "0" ]; then
          echo "Behat passed, no failure screenshot needed."
          exit 0
        fi
        node screenshot.js ${{ inputs.php }} failure
      working-directory: ${{ github.action_path }}
      env:
        ARTIFACT_DIR: ${{ github.workspace }}/artifacts
        MOODLE_SITE_URL: http://localhost:8080/moodle
        SCREENSHOT_OPTIONAL: 1

    - name: Print PHP built-in server logs
      shell: bash
      if: ${{ !cancelled() }}
      run: |
        cat server.log
        mkdir -p "${ARTIFACT_DIR}"
        cp server.log "${ARTIFACT_DIR}/server.log"
      working-directory: moodle
      env:
        ARTIFACT_DIR: ${{ github.workspace }}/artifacts

    - name: Summarise the result
      shell: bash
      if: ${{ !cancelled() }}
      run: |
        exitcode=$(cat "${RUNNER_TEMP}/behat-exit-code" 2>/dev/null || echo unknown)
        {
          if [ "${exitcode}" = "0" ]; then
            echo "### :white_check_mark: Web installer test passed on PHP ${{ inputs.php }}"
          else
            echo "### :x: Web installer test failed on PHP ${{ inputs.php }} (Behat exit code ${exitcode})"
          fi
          echo
          if [ -f "${ARTIFACT_DIR}/moodle-revision.txt" ]; then
            echo '```'
            head -6 "${ARTIFACT_DIR}/moodle-revision.txt"
            echo '```'
          fi
          if [ "${exitcode}" != "0" ] && [ -f "${ARTIFACT_DIR}/behat-output.txt" ]; then
            echo '```'
            # Strip the Behat formatter's gutter so the dump reads cleanly in the summary.
            sed -n '/---- PAGE DUMP/,/---- END PAGE DUMP/p' "${ARTIFACT_DIR}/behat-output.txt" \
              | sed -e 's/^[[:space:]]*│[[:space:]]\{0,2\}//' | head -50
            echo '```'
            echo
            echo "Full Behat output, response bodies, screenshots and the web server log are in the \`diagnostics-${{ inputs.php }}\` artifact."
          fi
        } >> "${GITHUB_STEP_SUMMARY}"
      env:
        ARTIFACT_DIR: ${{ github.workspace }}/artifacts

    - name: Upload diagnostics
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v4
      with:
        name: diagnostics-${{ inputs.php }}
        path: artifacts
        if-no-files-found: warn
